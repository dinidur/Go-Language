version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: student-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: studentdb
    ports:
      - "5432:5432"

  student-service:
    build:
      context: .
      dockerfile: student-service/Dockerfile
    container_name: student-service
    ports:
      - "9090:9090"
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres

  grade-service:
    build:
      context: .
      dockerfile: grade-service/Dockerfile
    container_name: grade-service
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - student-service
    environment:
      DB_HOST: postgres